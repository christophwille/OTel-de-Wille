# Weaver code-generation config for the `csharp` target.
# Selected by the positional TARGET argument:
#   weaver registry generate -r registry -t templates csharp <output-dir>
# Weaver loads templates/registry/csharp/weaver.yaml (this file) and renders
# every entry under `templates:` with the resolved registry as `ctx`.

whitespace_control:
  trim_blocks: true
  lstrip_blocks: true

# `brief | comment` renders C# XML-doc lines with this prefix.
comment_formats:
  csharp:
    format: markdown
    prefix: "/// "
    trim: true
    remove_trailing_dots: false
default_comment_format: csharp

# Overridable on the command line: -D namespace=My.Namespace
params:
  namespace: TodoApi.Telemetry
  # Signals imported from the OTel registry (registry/otel-imports.yaml) exist so
  # live-check can validate them; we do not want C# generated for them.
  exclude_root_namespace: [http]
  excluded_attributes: []

# Lookup tables used via the `map_text` filter.
text_maps:
  # OTel attribute type -> C# type (for typed span-start helpers)
  csharp_types:
    int: long
    double: double
    boolean: bool
    string: string
    string[]: string[]
    int[]: long[]
    double[]: double[]
    boolean[]: bool[]
  # OTel instrument -> System.Diagnostics.Metrics instrument type
  csharp_instruments:
    counter: Counter<long>
    updowncounter: UpDownCounter<long>
    histogram: Histogram<double>
    gauge: Gauge<long>
  # OTel instrument -> Meter factory method
  csharp_instrument_factories:
    counter: CreateCounter<long>
    updowncounter: CreateUpDownCounter<long>
    histogram: CreateHistogram<double>
    gauge: CreateGauge<long>
  # OTel span kind -> System.Diagnostics.ActivityKind
  csharp_activity_kinds:
    internal: ActivityKind.Internal
    server: ActivityKind.Server
    client: ActivityKind.Client
    producer: ActivityKind.Producer
    consumer: ActivityKind.Consumer

templates:
  # One file per attribute root namespace (todo -> TodoAttributes.g.cs, error -> ErrorAttributes.g.cs)
  - template: attributes.cs.j2
    filter: semconv_grouped_attributes($params)
    application_mode: each
    file_name: "{{ ctx.root_namespace | pascal_case }}Attributes.g.cs"
  # One file per metric root namespace
  - template: metrics.cs.j2
    filter: semconv_grouped_metrics($params)
    application_mode: each
    file_name: "{{ ctx.root_namespace | pascal_case }}Metrics.g.cs"
  # One file per span root namespace. There is no built-in "grouped spans"
  # helper, so group the flat span list with plain jq.
  - template: spans.cs.j2
    filter: 'semconv_signal("span"; $params) | group_by(.root_namespace) | map({root_namespace: .[0].root_namespace, spans: sort_by(.id)})'
    application_mode: each
    file_name: "{{ ctx.root_namespace | pascal_case }}Spans.g.cs"
